<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
    <title>AutoGate NX</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #131d40;
        color: #e2e8f0;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        user-select: none;
      }
      .title {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .sub {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div class="title">AutoGate NX</div>
      <div class="sub">IT park access control</div>
    </div>
  </body>
</html>
